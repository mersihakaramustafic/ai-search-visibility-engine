extractor_version: rules-llm-v1

strategy:
  openai: rules_and_llm
  gemini: rules_and_llm

matching:
  ambiguous_aliases:
    close: [Close]

  extra_ambiguous_forms:
    monday_crm: [monday.com, Monday.com, monday, Monday]
    freshsales: [Freshworks]

  exclusions:
    - SAP Sales Cloud
    - Oracle Sales Cloud
    - Bigin by Zoho
    - Zoho (?:One|Desk|Books|Bigin|Analytics|Voice|Projects|Sign|Inventory|Campaigns|Mail|Flow|SalesIQ|Forms|Survey|People|Recruit|Expense|Billing|Invoice|Creator|Social|Workplace|WorkDrive|Cliq|Marketing Plus)

  max_candidates_per_brand: 20

  snippet_chars: 120

citations:
  brand_url_rules:
    zoho_crm: [/crm]
    monday_crm: [/crm]
    freshsales: [/crm, crmsupport., freshsales]

llm:
  model: gpt-5.6-luna
  api_key_env: OPENAI_API_KEY
  timeout_seconds: 60
  max_output_tokens: 4000
  reasoning_effort: low
  prompt_version: p1
  schema_version: s1
  concurrency: 4

retry:
  max_attempts: 3
  initial_backoff_seconds: 2
  max_backoff_seconds: 60

pilot:
  observations_per_provider: 8

pricing:
  gpt-5.6-luna:
    input: 0.20
    cached_input: 0.02
    output: 1.20
